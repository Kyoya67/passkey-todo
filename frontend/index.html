<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>TODO Desk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-heading">
      <div class="auth-dialog-content">
        <div class="auth-top">
          <p class="eyebrow">WELCOME TO TODO DESK</p>
          <button
            id="auth-theme-toggle"
            data-theme-toggle
            type="button"
            class="theme-toggle"
            aria-label="ダークモードに切り替える"
            title="ダークモードに切り替える"
            aria-pressed="false"
          >
            <svg
              class="theme-icon theme-icon--moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M20.3 15.6A8.5 8.5 0 0 1 8.4 3.7 8.5 8.5 0 1 0 20.3 15.6Z" />
            </svg>
            <svg
              class="theme-icon theme-icon--sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
              />
            </svg>
          </button>
        </div>
        <h1 id="auth-heading">パスキーで始める</h1>
        <p class="auth-intro">TODOを使うには、パスキーを登録するかログインしてください。</p>
        <div class="auth-options">
          <section class="auth-option" aria-labelledby="register-heading">
            <p class="eyebrow">NEW HERE?</p>
            <h2 id="register-heading">はじめて使う</h2>
            <p>この端末のパスキーでユーザーを作成します。</p>
            <button id="register-passkey" type="button" class="button primary">
              パスキーを登録
            </button>
          </section>
          <section class="auth-option" aria-labelledby="login-heading">
            <p class="eyebrow">WELCOME BACK</p>
            <h2 id="login-heading">登録済みの方</h2>
            <p>登録済みのパスキーでログインします。</p>
            <button id="login-passkey" type="button" class="button primary">ログイン</button>
          </section>
        </div>
        <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </div>
    </dialog>
    <main id="todo-app" class="shell" hidden>
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1 class="hero-title">Kyoya67 TODO</h1>
            <p class="api-endpoint">
              <span class="api-url-label">API URL</span><output id="api-url"></output>
            </p>
          </div>
          <div class="hero-actions">
            <button
              id="theme-toggle"
              data-theme-toggle
              type="button"
              class="theme-toggle"
              aria-label="ダークモードに切り替える"
              title="ダークモードに切り替える"
              aria-pressed="false"
            >
              <svg
                class="theme-icon theme-icon--moon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20.3 15.6A8.5 8.5 0 0 1 8.4 3.7 8.5 8.5 0 1 0 20.3 15.6Z" />
              </svg>
              <svg
                class="theme-icon theme-icon--sun"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
                />
              </svg>
            </button>
            <button id="logout-button" type="button" class="button logout-button">
              ログアウト
            </button>
          </div>
        </div>
      </header>
      <section class="panel composer">
        <div>
          <p class="eyebrow">NEW TASK</p>
          <h2>新しいTODOを追加</h2>
        </div>
        <form id="todo-form">
          <input id="title" required maxlength="200" placeholder="例：牛乳を買う" />
          <button class="button primary">追加する</button>
        </form>
      </section>
      <section class="panel list-panel">
        <div class="list-header">
          <div>
            <p class="eyebrow">YOUR LIST</p>
            <h2>TODOボード</h2>
          </div>
        </div>
        <form id="search-form" class="search-form">
          <label for="search-title">タイトルで検索</label>
          <input id="search-title" type="search" placeholder="例：買い物" />
          <button class="button secondary">検索</button>
        </form>
        <p id="message" role="status"></p>
        <div id="todo-list" class="kanban-board"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
