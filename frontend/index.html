<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODO Desk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-heading">
      <div class="auth-dialog-content">
        <p class="eyebrow">WELCOME TO TODO DESK</p>
        <h1 id="auth-heading">パスキーで始める</h1>
        <p class="auth-intro">TODOを使うには、パスキーを登録するかログインしてください。</p>
        <div class="auth-options">
          <section class="auth-option" aria-labelledby="register-heading">
            <p class="eyebrow">NEW HERE?</p>
            <h2 id="register-heading">はじめて使う</h2>
            <p>この端末のパスキーでユーザーを作成します。</p>
            <button id="register-passkey" type="button" class="button primary">
              パスキーを登録
            </button>
          </section>
          <section class="auth-option" aria-labelledby="login-heading">
            <p class="eyebrow">WELCOME BACK</p>
            <h2 id="login-heading">登録済みの方</h2>
            <p>登録済みのパスキーでログインします。</p>
            <button id="login-passkey" type="button" class="button primary">ログイン</button>
          </section>
        </div>
        <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      </div>
    </dialog>
    <main id="todo-app" class="shell" hidden>
      <header class="hero">
        <div class="hero-top">
          <div>
            <h1 class="hero-title">Kyoya67 TODO</h1>
            <p class="api-endpoint">
              <span class="api-url-label">API URL</span><output id="api-url"></output>
            </p>
          </div>
          <button id="logout-button" type="button" class="button logout-button">ログアウト</button>
        </div>
      </header>
      <section class="panel composer">
        <div>
          <p class="eyebrow">NEW TASK</p>
          <h2>新しいTODOを追加</h2>
        </div>
        <form id="todo-form">
          <input id="title" required maxlength="200" placeholder="例：牛乳を買う" />
          <button class="button primary">追加する</button>
        </form>
      </section>
      <section class="panel list-panel">
        <div class="list-header">
          <div>
            <p class="eyebrow">YOUR LIST</p>
            <h2>TODOボード</h2>
            <p class="board-hint">未着手・進行中は、上ほど優先</p>
          </div>
        </div>
        <form id="search-form" class="search-form">
          <label for="search-title">タイトルで検索</label>
          <input id="search-title" type="search" placeholder="例：買い物" />
          <button class="button secondary">検索</button>
        </form>
        <p id="message" role="status"></p>
        <div id="todo-list" class="kanban-board"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
