<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODO Desk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">KYoya67 TODO API</p>
        <p class="lead">シンプルな画面からTODO APIを操作できます。</p>
        <div class="connection"><label for="api-url">API URL</label><input id="api-url" type="url" value="https://api.ca-techlounge-todo.kyo8.dev" /><button id="health-button" class="button secondary">接続確認</button><span id="health-status">未確認</span></div>
      </header>
      <section class="panel composer"><div><p class="eyebrow">NEW TASK</p><h2>新しいTODOを追加</h2></div><form id="todo-form"><input id="title" required maxlength="200" placeholder="例：牛乳を買う" /><button class="button primary">追加する</button></form></section>
      <section class="panel list-panel"><div class="list-header"><div><p class="eyebrow">YOUR LIST</p><h2>TODO一覧 <span id="todo-count">0</span></h2></div><button id="refresh-button" class="button secondary">更新する</button></div><p id="message" role="status"></p><div id="todo-list"></div></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
