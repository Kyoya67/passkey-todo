<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODO Desk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">KYoya67 TODO API</p>
        <p class="lead">シンプルな画面からTODO APIを操作できます。</p>
        <div class="connection">
          <span class="api-url-label">API URL</span><output id="api-url"></output
          ><button id="health-button" class="button secondary">接続確認</button
          ><span id="health-status">未確認</span>
        </div>
      </header>
      <section class="panel passkey-panel" aria-labelledby="passkey-heading">
        <div>
          <p class="eyebrow">PASSKEY</p>
          <h2 id="passkey-heading">パスキーを登録</h2>
          <p class="passkey-note">
            この端末のパスキーで新しいユーザーを作成します。登録後のログイン機能はまだありません。
          </p>
        </div>
        <div class="passkey-action">
          <button id="register-passkey" type="button" class="button primary">
            パスキーを登録する
          </button>
          <p id="passkey-status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <section class="panel composer">
        <div>
          <p class="eyebrow">NEW TASK</p>
          <h2>新しいTODOを追加</h2>
        </div>
        <form id="todo-form">
          <input id="title" required maxlength="200" placeholder="例：牛乳を買う" /><button
            class="button primary"
          >
            追加する
          </button>
        </form>
      </section>
      <section class="panel list-panel">
        <div class="list-header">
          <div>
            <p class="eyebrow">YOUR LIST</p>
            <h2>TODO一覧</h2>
          </div>
        </div>
        <form id="search-form" class="search-form">
          <label for="search-title">タイトルで検索</label>
          <input id="search-title" type="search" placeholder="例：買い物" />
          <button class="button secondary">検索</button>
        </form>
        <p id="message" role="status"></p>
        <div id="todo-list"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
