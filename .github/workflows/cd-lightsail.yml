name: CD Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
  LIGHTSAIL_SSH_USER: ${{ vars.LIGHTSAIL_SSH_USER }}
  LIGHTSAIL_APP_DIR: ${{ vars.LIGHTSAIL_APP_DIR }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment variables
        run: |
          set -eu
          for variable in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY LIGHTSAIL_HOST LIGHTSAIL_SSH_USER LIGHTSAIL_APP_DIR; do
            if [ -z "${!variable}" ]; then
              echo "GitHub repository variable ${variable} is required" >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --file backend/Dockerfile \
            --tag "${image}" \
            backend

          docker push "${image}"

          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:passkey-todo-cd
          ping: ${{ vars.LIGHTSAIL_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/lightsail_cd
          chmod 600 ~/.ssh/lightsail_cd

          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Authenticate Lightsail to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          aws ecr get-login-password --region "${AWS_REGION}" |
            ssh -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                -o ConnectTimeout=10 \
                -i ~/.ssh/lightsail_cd \
                "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
                "docker login --username AWS --password-stdin '${ECR_REGISTRY}'"

      - name: Deploy to Lightsail
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/lightsail_cd \
              "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
              "cd '${LIGHTSAIL_APP_DIR}' && \
               BACKEND_IMAGE='${IMAGE}' docker compose pull backend && \
               BACKEND_IMAGE='${IMAGE}' docker compose up -d --no-deps --no-build backend"

      - name: Verify deployment
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/lightsail_cd \
              "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
              "cd '${LIGHTSAIL_APP_DIR}' && \
               BACKEND_IMAGE='${IMAGE}' docker compose ps backend"