name: Validate Tailscale SSH

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
  LIGHTSAIL_SSH_USER: ${{ vars.LIGHTSAIL_SSH_USER }}

jobs:
  tailscale-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:passkey-todo-cd
          ping: ${{ vars.LIGHTSAIL_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail_cd
          chmod 600 ~/.ssh/lightsail_cd
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate SSH connection
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/lightsail_cd \
              "${LIGHTSAIL_SSH_USER}@${LIGHTSAIL_HOST}" \
              'hostname && echo "Tailscale SSH validation succeeded"'