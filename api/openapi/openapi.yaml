openapi: 3.0.3
info:
  title: Kyoya67 TODO API
  version: 1.0.0
  description: TODOリストを管理するREST API

servers:
  - url: http://localhost:8080
    description: ローカルAPI
  - url: https://api.ca-techlounge-todo.kyo8.dev
    description: AWS上のAPI

tags:
  - name: auth
    description: パスキー登録（ログインセッション発行は後続対応）
  - name: todos
    description: TODO管理
  - name: health
    description: ヘルスチェック

paths:
  /auth/registration/begin:
    post:
      tags: [auth]
      summary: パスキー登録を開始
      description: 設定されたフロントエンドOriginから呼び出す。5分間有効な登録IDとWebAuthn作成オプションを返す。
      operationId: beginRegistration
      responses:
        '200':
          description: 登録オプション。options.publicKeyをブラウザのWebAuthn APIに渡す（バイナリ項目はbase64urlから変換）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationOptions'
        '403':
          description: Originが未指定または許可されていない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/registration/finish:
    post:
      tags: [auth]
      summary: パスキー登録を完了
      description: 登録IDは検証時に一度だけ消費する。失敗した場合は登録開始からやり直す。成功時にユーザーとCredentialを保存するが、ログインセッションはまだ発行しない。
      operationId: finishRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '204':
          description: ユーザーとパスキーを登録した
        '400':
          description: 入力不正、64KiB超の本文、登録期限切れ、使用済み登録ID、またはWebAuthn検証失敗
        '403':
          description: Originが未指定または許可されていない
        '415':
          description: Content-Typeがapplication/jsonではない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /health:
    get:
      tags:
        - health
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        '200':
          description: バックエンドが起動している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /todos:
    post:
      tags:
        - todos
      summary: TODOを作成
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
      responses:
        '204':
          description: TODOを作成した
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags:
        - todos
      summary: TODO一覧を取得
      operationId: listTodos
      parameters:
        - $ref: '#/components/parameters/TitleQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: TODO一覧を取得した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /todos/{id}:
    put:
      tags:
        - todos
      summary: TODOのタイトルを更新
      operationId: updateTodo
      parameters:
        - $ref: '#/components/parameters/TodoID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
      responses:
        '204':
          description: TODOを更新した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags:
        - todos
      summary: TODOを削除
      operationId: deleteTodo
      parameters:
        - $ref: '#/components/parameters/TodoID'
      responses:
        '204':
          description: TODOを削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  parameters:
    TodoID:
      name: id
      in: path
      required: true
      description: TODOのID
      schema:
        type: integer
        format: int64
        minimum: 1

    TitleQuery:
      name: title
      in: query
      required: false
      description: タイトルの部分一致検索文字列
      schema:
        type: string

    LimitQuery:
      name: limit
      in: query
      required: false
      description: 取得件数。未指定時は100件、最大1000件
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100

    OffsetQuery:
      name: offset
      in: query
      required: false
      description: 先頭からスキップする件数
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

  schemas:
    RegistrationOptions:
      type: object
      required: [registrationId, options]
      properties:
        registrationId:
          type: string
          description: 登録完了に必要なランダムトークン。ログへ記録しない。
        options:
          $ref: '#/components/schemas/WebAuthnCreationOptions'

    WebAuthnCreationOptions:
      type: object
      x-go-type: protocol.CredentialCreation
      x-go-type-import:
        path: github.com/go-webauthn/webauthn/protocol
        name: protocol
      required: [publicKey]
      properties:
        publicKey:
          type: object
          description: WebAuthn PublicKeyCredentialCreationOptions。challengeとuser.idはbase64url文字列。
          additionalProperties: true

    RegistrationRequest:
      type: object
      required: [registrationId, credential]
      properties:
        registrationId:
          type: string
          minLength: 1
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'

    WebAuthnCredential:
      type: object
      x-go-type: protocol.CredentialCreationResponse
      x-go-type-import:
        path: github.com/go-webauthn/webauthn/protocol
        name: protocol
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
          description: Credential IDをbase64urlでエンコードした値
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              type: string
              description: base64url形式のクライアントデータ
            attestationObject:
              type: string
              description: base64url形式のattestation object
            transports:
              type: array
              items:
                type: string
        clientExtensionResults:
          type: object
          additionalProperties: true
        authenticatorAttachment:
          type: string

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    TodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          description: TODOのタイトル
          example: 買い物をする

    Todo:
      type: object
      required:
        - id
        - title
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: 買い物をする
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TodoListResponse:
      type: object
      required:
        - todos
      properties:
        todos:
          type: array
          items:
            $ref: '#/components/schemas/Todo'

  responses:
    BadRequest:
      description: リクエストが不正
    NotFound:
      description: 指定されたTODOが存在しない
    ServiceUnavailable:
      description: サーバーまたはデータベースでエラーが発生した
