openapi: 3.0.3
info:
  title: Kyoya67 TODO API
  version: 1.0.0
  description: TODOリストを管理するREST API

servers:
  - url: http://localhost:8080
    description: ローカルAPI
  - url: https://api.ca-techlounge-todo.kyo8.dev
    description: AWS上のAPI

tags:
  - name: auth
    description: パスキー登録・ログイン・ログアウト
  - name: todos
    description: TODO管理
  - name: health
    description: ヘルスチェック

paths:
  /auth/registration/begin:
    post:
      tags: [auth]
      summary: パスキー登録を開始
      description: 設定されたフロントエンドOriginから呼び出す。5分間有効な登録IDとWebAuthn作成オプションを返す。
      operationId: beginRegistration
      responses:
        '200':
          description: 登録オプション。options.publicKeyをブラウザのWebAuthn APIに渡す（バイナリ項目はbase64urlから変換）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationOptions'
        '403':
          description: Originが未指定または許可されていない
        '429':
          description: IP単位の認証リクエスト制限を超過（Retry-Afterヘッダー）
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/registration/finish:
    post:
      tags: [auth]
      summary: パスキー登録を完了
      description: 登録IDは検証時に一度だけ消費する。失敗した場合は登録開始からやり直す。成功時にユーザーとCredentialを保存するが、ログインセッションはまだ発行しない。
      operationId: finishRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '204':
          description: ユーザーとパスキーを登録した
        '400':
          description: 入力不正、64KiB超の本文、登録期限切れ、使用済み登録ID、またはWebAuthn検証失敗
        '403':
          description: Originが未指定または許可されていない
        '415':
          description: Content-Typeがapplication/jsonではない
        '429':
          description: IP単位の認証リクエスト制限を超過（Retry-Afterヘッダー）
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login/begin:
    post:
      tags: [auth]
      summary: パスキーログインを開始
      description: 5分間有効な使い捨てログインIDとWebAuthn取得オプションを返す。
      operationId: beginLogin
      responses:
        '200':
          description: ログインオプション
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOptions'
        '403':
          description: Originが未指定または許可されていない
        '429':
          description: IP単位の認証リクエスト制限を超過（Retry-Afterヘッダー）
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login/finish:
    post:
      tags: [auth]
      summary: パスキーログインを完了
      description: ログインIDを一度だけ消費し、署名検証に成功した場合のみHttpOnlyセッションCookieを発行する。
      operationId: finishLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: ログイン成功。Set-Cookieでセッションを発行する
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          description: 入力不正、ログインID期限切れ・使用済み、または署名検証失敗
        '403':
          description: Originが未指定または許可されていない
        '415':
          description: Content-Typeがapplication/jsonではない
        '429':
          description: IP単位の認証リクエスト制限を超過（Retry-Afterヘッダー）
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      description: 現在のセッションを無効化し、Cookieを失効させる。セッションがなくても成功する。
      operationId: logout
      responses:
        '204':
          description: ログアウトした
          headers:
            Set-Cookie:
              schema:
                type: string
        '403':
          description: Originが未指定または許可されていない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /health:
    get:
      tags:
        - health
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        '200':
          description: バックエンドが起動している
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /todos:
    post:
      tags:
        - todos
      security:
        - todoSession: []
      summary: TODOを作成
      description: ログイン中のユーザーを所有者として保存する
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
      responses:
        '204':
          description: TODOを作成した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Originが許可されていない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags:
        - todos
      security:
        - todoSession: []
      summary: TODO一覧を取得
      description: ログイン中のユーザーが所有するTODOのみ取得する
      operationId: listTodos
      parameters:
        - $ref: '#/components/parameters/TitleQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: TODO一覧を取得した
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /todos/{id}:
    put:
      tags:
        - todos
      security:
        - todoSession: []
      summary: TODOのタイトル・状態を更新
      description: ログイン中のユーザーが所有するTODOのみ更新する。他人のTODOは404を返す
      operationId: updateTodo
      parameters:
        - $ref: '#/components/parameters/TodoID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoRequest'
      responses:
        '204':
          description: TODOを更新した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Originが許可されていない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags:
        - todos
      security:
        - todoSession: []
      summary: TODOを削除
      description: ログイン中のユーザーが所有するTODOのみ削除する。他人のTODOは404を返す
      operationId: deleteTodo
      parameters:
        - $ref: '#/components/parameters/TodoID'
      responses:
        '204':
          description: TODOを削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Originが許可されていない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /todos/{id}/position:
    put:
      tags:
        - todos
      security:
        - todoSession: []
      summary: TODOを同じ状態・優先度のグループ内で並べ替える
      description: 未着手・進行中のTODOのみ並べ替えられる。beforeIdを指定するとそのTODOの直前へ、省略またはnullの場合はグループ末尾へ移動する。完了したTODOや別の状態・優先度のTODOは指定できない
      operationId: moveTodo
      parameters:
        - $ref: '#/components/parameters/TodoID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTodoRequest'
      responses:
        '204':
          description: 並び順を更新した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Originが許可されていない
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    todoSession:
      type: apiKey
      in: cookie
      name: todo_session

  parameters:
    TodoID:
      name: id
      in: path
      required: true
      description: TODOのID
      schema:
        type: integer
        format: int64
        minimum: 1

    TitleQuery:
      name: title
      in: query
      required: false
      description: タイトルの部分一致検索文字列
      schema:
        type: string

    LimitQuery:
      name: limit
      in: query
      required: false
      description: 取得件数。未指定時は100件、最大1000件
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100

    OffsetQuery:
      name: offset
      in: query
      required: false
      description: 先頭からスキップする件数
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

  schemas:
    LoginOptions:
      type: object
      required: [loginId, options]
      properties:
        loginId:
          type: string
          description: ログイン完了に必要なランダムトークン
        options:
          type: object
          x-go-type: protocol.CredentialAssertion
          x-go-type-import:
            path: github.com/go-webauthn/webauthn/protocol
            name: protocol
          required: [publicKey]
          properties:
            publicKey:
              type: object
              description: challengeはbase64url文字列。navigator.credentials.getへ渡す前にバイト列へ変換する。
              additionalProperties: true

    LoginRequest:
      type: object
      required: [loginId, credential]
      properties:
        loginId:
          type: string
          minLength: 1
        credential:
          type: object
          x-go-type: protocol.CredentialAssertionResponse
          x-go-type-import:
            path: github.com/go-webauthn/webauthn/protocol
            name: protocol
          required: [id, rawId, type, response]
          properties:
            id:
              type: string
            rawId:
              type: string
              description: base64url形式
            type:
              type: string
              enum: [public-key]
            response:
              type: object
              required: [clientDataJSON, authenticatorData, signature, userHandle]
              properties:
                clientDataJSON:
                  type: string
                authenticatorData:
                  type: string
                signature:
                  type: string
                userHandle:
                  type: string
            clientExtensionResults:
              type: object
              additionalProperties: true
            authenticatorAttachment:
              type: string

    RegistrationOptions:
      type: object
      required: [registrationId, options]
      properties:
        registrationId:
          type: string
          description: 登録完了に必要なランダムトークン。ログへ記録しない。
        options:
          $ref: '#/components/schemas/WebAuthnCreationOptions'

    WebAuthnCreationOptions:
      type: object
      x-go-type: protocol.CredentialCreation
      x-go-type-import:
        path: github.com/go-webauthn/webauthn/protocol
        name: protocol
      required: [publicKey]
      properties:
        publicKey:
          type: object
          description: WebAuthn PublicKeyCredentialCreationOptions。challengeとuser.idはbase64url文字列。
          additionalProperties: true

    RegistrationRequest:
      type: object
      required: [registrationId, credential]
      properties:
        registrationId:
          type: string
          minLength: 1
        credential:
          $ref: '#/components/schemas/WebAuthnCredential'

    WebAuthnCredential:
      type: object
      x-go-type: protocol.CredentialCreationResponse
      x-go-type-import:
        path: github.com/go-webauthn/webauthn/protocol
        name: protocol
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
          description: Credential IDをbase64urlでエンコードした値
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              type: string
              description: base64url形式のクライアントデータ
            attestationObject:
              type: string
              description: base64url形式のattestation object
            transports:
              type: array
              items:
                type: string
        clientExtensionResults:
          type: object
          additionalProperties: true
        authenticatorAttachment:
          type: string

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    TodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          description: TODOのタイトル
          example: 買い物をする
        status:
          $ref: '#/components/schemas/TodoStatus'
        priorityLevel:
          $ref: '#/components/schemas/TodoPriorityLevel'

    MoveTodoRequest:
      type: object
      properties:
        beforeId:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: 移動先の直後にある同じ状態・優先度グループのTODOのID。省略時はグループ末尾へ移動する

    TodoStatus:
      type: string
      description: 未着手・進行中・完了。省略時は未着手
      enum: [not_started, in_progress, completed]

    TodoPriorityLevel:
      type: string
      description: 未着手・進行中で使用する優先度（high=高、medium=中、low=小）。省略時は中。完了列では順位付けに使用しない
      enum: [high, medium, low]

    Todo:
      type: object
      required:
        - id
        - title
        - status
        - priority
        - priorityLevel
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: 買い物をする
        status:
          $ref: '#/components/schemas/TodoStatus'
        priority:
          type: integer
          format: int64
          description: 同じ状態・優先度グループ内の順位。小さいほど上。完了では使用しない
        priorityLevel:
          $ref: '#/components/schemas/TodoPriorityLevel'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TodoListResponse:
      type: object
      required:
        - todos
      properties:
        todos:
          type: array
          items:
            $ref: '#/components/schemas/Todo'

  responses:
    BadRequest:
      description: リクエストが不正
    Unauthorized:
      description: 有効なログインセッションがない
    NotFound:
      description: 指定されたTODOが存在しない
    ServiceUnavailable:
      description: サーバーまたはデータベースでエラーが発生した
